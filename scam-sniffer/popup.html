<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>🕵️ ScamSniffer</h2>
    
    <div id="setup-view">
      <p>Enter your Gemini API Key:</p>
      <input type="password" id="apiKeyInput" placeholder="Paste API Key here">
      <button id="saveKeyBtn">Save Key</button>
    </div>

    <div id="main-view" class="hidden">
      <button id="scanBtn" class="primary-btn">📸 Scan Page for Scams</button>
      
      <div id="loading" class="hidden">
        <div class="spinner"></div>
        <p>Analyzing pixels...</p>
      </div>

      <div id="result" class="hidden">
        <h3>Analysis Result:</h3>
        <div id="risk-level"></div>
        <p id="analysis-text"></p>
      </div>
      
      <button id="changeKeyBtn" class="text-btn">Change API Key</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
